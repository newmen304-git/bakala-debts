workflows:
  android-release:
    name: بناء تطبيق ديون البقالة
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: تحميل المكتبات
        script: flutter pub get
      - name: بناء APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
